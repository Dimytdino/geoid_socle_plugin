# CI du socle : les cinq tests tournent a chaque push et pull request.
# La dependance 'markdown' est installee pour que test_generer_doc_html
# s'execute reellement (sans elle, il sort en SKIP silencieusement vert).
name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Dependances
        run: pip install -r requirements-dev.txt
      - name: Test d'integrite du socle
        run: python3 tests/test_socle_integrity.py
      - name: Test du packageur de skills
        run: python3 tests/test_packager_skill.py
      - name: Test du generateur de doc HTML
        run: |
          python3 tests/test_generer_doc_html.py | tee sortie.txt
          grep -q "3 tests OK" sortie.txt   # refuse le SKIP : markdown doit etre present en CI
      - name: Test du verificateur de migration plugin
        run: python3 tests/test_verifier_migration_plugin.py
      - name: Test des evals de declenchement des skills
        run: python3 tests/test_evaluer_declenchement.py
